<!DOCTYPE html>
<html>
<head>
  <title>XMind Import Test</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
</head>
<body>
  <h1>XMind Import Test</h1>
  <input type="file" id="fileInput" accept=".xmind">
  <div id="result"></div>

  <script>
    document.getElementById('fileInput').addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const result = document.getElementById('result');
      result.innerHTML = '<p>Processing...</p>';

      try {
        console.log('File:', file.name, file.size, 'bytes');

        // Read file
        const arrayBuffer = await file.arrayBuffer();
        console.log('ArrayBuffer size:', arrayBuffer.byteLength);

        // Parse ZIP
        const zip = await JSZip.loadAsync(arrayBuffer);
        console.log('ZIP loaded, files:', Object.keys(zip.files));

        // Get content.json
        const contentFile = zip.files['content.json'];
        if (!contentFile) {
          throw new Error('content.json not found in ZIP');
        }

        const contentJson = await contentFile.async('string');
        console.log('content.json length:', contentJson.length);

        const content = JSON.parse(contentJson);
        console.log('Parsed content:', content);

        result.innerHTML = '<pre>' + JSON.stringify(content, null, 2) + '</pre>';

      } catch (error) {
        console.error('Error:', error);
        result.innerHTML = '<p style="color: red;">Error: ' + error.message + '</p>';
      }
    });
  </script>
</body>
</html>
